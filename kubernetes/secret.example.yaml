#     --from-literal=AIRFLOW__CORE__FERNET_KEY=... \
#     --from-literal=AIRFLOW_ADMIN_USER=admin \
#     --from-literal=AIRFLOW_ADMIN_PASSWORD=admin
#   kubectl -n purchase-orders create secret generic snowflake-key \
#     --from-file=rsa_key.p8=./rsa_key.p8
apiVersion: v1
kind: Secret
metadata:
  name: snowflake-creds
  namespace: purchase-orders
type: Opaque
stringData:
  SNOWFLAKE_ACCOUNT: "CHANGE_ME"
  SNOWFLAKE_USER: "CHANGE_ME"
  SNOWFLAKE_PASSWORD: "CHANGE_ME"
  SNOWFLAKE_ROLE: "ACCOUNTADMIN"
  SNOWFLAKE_WAREHOUSE: "PO_WH"
  SNOWFLAKE_DATABASE: "PURCHASE_ORDER_DB"
  SNOWFLAKE_SCHEMA: "RAW"
  AIRFLOW__CORE__FERNET_KEY: "CHANGE_ME"
  AIRFLOW_ADMIN_USER: "admin"
  AIRFLOW_ADMIN_PASSWORD: "admin"
