# EXAMPLE ONLY — do not apply with real secrets committed.
# Create locally instead (see docs/kubernetes.md / README):
#   kubectl -n purchase-orders create secret generic snowflake-creds \
#     --from-literal=SNOWFLAKE_ACCOUNT=... \
#     --from-literal=SNOWFLAKE_USER=... \
#     --from-literal=SNOWFLAKE_PASSWORD=... \
#     --from-literal=SNOWFLAKE_ROLE=ACCOUNTADMIN \
#     --from-literal=SNOWFLAKE_WAREHOUSE=PO_WH \
