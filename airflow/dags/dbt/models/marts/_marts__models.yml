version: 2

models:
  - name: dim_supplier
    columns:
      - name: supplier_code
        tests: [unique, not_null]

  - name: dim_category
    columns:
      - name: category_code
        tests: [unique, not_null]

  - name: dim_account
    columns:
      - name: account_code
        tests: [unique, not_null]

  - name: dim_cost_center
    columns:
      - name: cost_center_code
        tests: [unique, not_null]

  - name: dim_project
    columns:
      - name: project_code
        tests: [unique, not_null]

  - name: dim_date
    columns:
      - name: date_day
        tests: [unique, not_null]

  - name: fct_purchase_order_lines
    description: One row per order line with receipt aggregates and derived fulfilment.
    columns:
      - name: order_line_key
        tests: [unique, not_null]
      - name: order_number
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_purchase_orders')
                field: order_number
      - name: supplier_code
        tests:
          - relationships:
              arguments:
                to: ref('dim_supplier')
                field: supplier_code
      - name: category_code
        tests:
          - relationships:
              arguments:
                to: ref('dim_category')
                field: category_code
      - name: derived_line_fulfilment
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['cancelled', 'unreceived', 'partial', 'complete', 'over_received']
                quote: true

  - name: fct_po_cost_allocations
    description: Coding-split grain; allocated amounts use SplitPercent / 100.
    columns:
      - name: coding_key
        tests: [unique, not_null]
      - name: account_code
        tests:
          - relationships:
              arguments:
                to: ref('dim_account')
                field: account_code
      - name: cost_center_code
        tests:
          - relationships:
              arguments:
                to: ref('dim_cost_center')
                field: cost_center_code
      - name: project_code
        tests:
          - relationships:
              arguments:
                to: ref('dim_project')
                field: project_code
      - name: order_line_key
        tests:
          - relationships:
              arguments:
                to: ref('fct_purchase_order_lines')
                field: order_line_key

  - name: fct_goods_receipts
    description: One row per goods receipt number (reversals stay signed).
    columns:
      - name: goods_receipt_number
        tests: [unique, not_null]
      - name: order_number
        tests: [not_null]
